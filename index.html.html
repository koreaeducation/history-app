<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}</style>
<title>중국사 AI 복습 노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 청화백자(청색·백색) 카드 노트. 위에 시대 연표(진도 막대), 아래에 카드·퀴즈·AI 선생님·내 카드 탭. 외부 글꼴·외부 요청 없음. */
:root{
  --bg:#f3f6fb; --surface:#ffffff; --ink:#14213d; --muted:#56637f; --line:#d3ddee;
  --cobalt:#1d3f9e; --on-cobalt:#ffffff; --cobalt-soft:#e5ebfa;
  --good:#1b7556; --good-soft:#dff2ea; --bad:#ad3527; --bad-soft:#fae8e4;
  --amber:#7a5200; --amber-soft:#fbf0d9;
  --f-display:'Nanum Myeongjo','Noto Serif KR','AppleMyungjo','Batang',serif;
  --f-body:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Nanum Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1222; --surface:#141d33; --ink:#e8edf8; --muted:#9aa7c4; --line:#2a3757;
    --cobalt:#8eaaff; --on-cobalt:#0c1222; --cobalt-soft:#1b2848;
    --good:#5fd1a2; --good-soft:#12302a; --bad:#ff9482; --bad-soft:#3a1c19;
    --amber:#f0c36b; --amber-soft:#3a2f14; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1222; --surface:#141d33; --ink:#e8edf8; --muted:#9aa7c4; --line:#2a3757;
  --cobalt:#8eaaff; --on-cobalt:#0c1222; --cobalt-soft:#1b2848;
  --good:#5fd1a2; --good-soft:#12302a; --bad:#ff9482; --bad-soft:#3a1c19;
  --amber:#f0c36b; --amber-soft:#3a2f14; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header .eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,6vw,34px);line-height:1.25;margin:4px 0 0;text-wrap:balance;color:var(--cobalt)}
header p{margin:6px 0 0;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
a:focus-visible,button:focus-visible,[role=button]:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex="-1"]:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.msg{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber);border-radius:10px;padding:10px 14px}
.eras{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.era{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.era .yr{font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--cobalt);font-variant-numeric:tabular-nums;line-height:1.2}
.era .nm{font-size:13px;line-height:1.35}
.era .ct{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{display:block;height:4px;border-radius:2px;background:var(--cobalt-soft);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cobalt)}
.era[aria-pressed=true]{background:var(--cobalt);border-color:var(--cobalt)}
.era[aria-pressed=true] .yr,.era[aria-pressed=true] .nm,.era[aria-pressed=true] .ct{color:var(--on-cobalt)}
.era[aria-pressed=true] .bar{background:color-mix(in srgb,var(--on-cobalt) 30%,transparent)}
.era[aria-pressed=true] .bar i{background:var(--on-cobalt)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:500;color:var(--muted);margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected=true]{color:var(--cobalt);border-bottom-color:var(--cobalt);font-weight:700}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.grow{flex:1 1 180px;min-width:0}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:500}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);color:var(--on-cobalt);border-color:var(--cobalt);font-weight:700}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.good{border-color:var(--good);color:var(--good)}
.btn.warn{border-color:var(--bad);color:var(--bad)}
a.btn{display:inline-block;text-decoration:none;color:inherit}
a.btn.primary{color:var(--on-cobalt)}
.linkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
a.linkbtn{display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0}
.linkbtn .ln{font-weight:700;font-size:16px}
.linkbtn .lh{font-size:12px;opacity:.85;overflow-wrap:anywhere}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--cobalt-soft);border-radius:10px;padding:10px 12px;min-width:0}
.sv{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--cobalt);font-variant-numeric:tabular-nums;line-height:1.3}
.card{background:var(--surface);border:1px solid var(--cobalt);border-radius:12px;padding:6px}
.card-in{border:1px solid var(--line);border-radius:8px;min-height:230px;padding:22px 20px;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center;cursor:pointer}
.card-in.static{min-height:140px;cursor:default}
.side{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.q{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,4.6vw,22px);line-height:1.55;text-wrap:balance;overflow-wrap:anywhere}
.ans{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,5.6vw,28px);color:var(--cobalt);line-height:1.4;overflow-wrap:anywhere}
.note{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11px;border:1px solid var(--cobalt);color:var(--cobalt);border-radius:999px;padding:0 8px;align-self:center}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.opts{display:grid;gap:8px}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;overflow-wrap:anywhere}
.opt:hover:not([disabled]){border-color:var(--cobalt)}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;overflow-wrap:anywhere}
.box.soft{background:var(--cobalt-soft);border-color:transparent}
.box p{margin:6px 0 0}
.out{white-space:pre-wrap;min-height:1.6em}
.chip{display:inline-block;border-radius:999px;padding:1px 10px;font-weight:700;font-size:13px;border:1px solid}
.chip.good{color:var(--good);background:var(--good-soft);border-color:var(--good)}
.chip.half{color:var(--amber);background:var(--amber-soft);border-color:var(--amber)}
.chip.bad{color:var(--bad);background:var(--bad-soft);border-color:var(--bad)}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
textarea{min-height:84px;resize:vertical}
form{display:grid;gap:10px}
.mine{display:flex;gap:8px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:8px 0;min-width:0}
.mine span{min-width:0;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .btn{font-size:13px;padding:6px 10px}
h2{font-family:var(--f-display);font-size:19px;margin:0}
.big{font-family:var(--f-display);font-weight:800;font-size:34px;color:var(--cobalt);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">중2 세계사 · 몽골 제국에서 중화인민공화국까지</div>
    <h1>중국사 AI 복습 노트</h1>
    <p>시대를 고르고, 카드로 외우고, 퀴즈로 확인하고, AI 선생님 탭에서 궁금한 것을 물어보세요. 학습 기록은 이 기기에만 저장돼요.</p>
  </header>
  <div id="msg" class="msg" role="status" hidden></div>
  <nav class="eras" id="eras" aria-label="시대 선택"></nav>
  <div class="tabs" role="tablist" id="tabs" aria-label="학습 방법"></div>
  <main class="panel" id="main" role="tabpanel" tabindex="-1"></main>
</div>

<script>
(function(){
"use strict";

/* ================= 기본 카드: [시대, 문제, 답, 설명] (활동지 2-2 ~ 2-8 범위) ================= */
var BASE = [
["won","13세기 초 몽골 부족을 통일한 테무친이 추대된 칭호는?","칭기즈 칸","1206년 몽골 제국이 세워졌어요. 한(汗)은 몽골·튀르크 지역에서 군주를 부르던 말이에요."],
["won","칭기즈 칸 사후 왕위 계승 분쟁 등으로 몽골 제국이 나뉜 네 나라를 부르는 말은?","울루스","몽골어로 '많은 사람'이라는 뜻이고, 점차 부족·국가를 가리켰어요."],
["won","쿠빌라이 칸이 수도로 삼은 곳과 바꾼 국호는?","대도(베이징), 원","1271년 원을 세웠고, 원을 중심으로 울루스들이 느슨하게 연합했어요."],
["won","몽골인을 최고로 삼고 한인·남인을 차별한 원의 정책은?","몽골 제일주의","한인은 옛 금나라 지역, 남인은 옛 남송 지역의 한족이에요. 몽골 침입 때 남송의 저항이 가장 컸어요."],
["won","몽골 제일주의에서 서역 출신으로 재정·행정을 맡아 우대받은 사람들은?","색목인",""],
["won","몽골 제국이 도로를 따라 약 40km마다 설치해 사신에게 말과 숙소를 제공한 제도는?","역참제","지금의 고속도로 휴게소와 비슷해요. 마르코 폴로의 『동방견문록』에도 나와요."],
["won","몽골 제국 시기 초원길·비단길·바닷길이 연결되어 형성된 교역권은?","유라시아·인도양 교역권","도로망을 마련하고 대운하를 정비했어요."],
["won","원에서 17년간 머물며 『동방견문록』을 남긴 이탈리아 상인은?","마르코 폴로",""],
["won","원이 쇠퇴하게 된 경제적 원인은?","과도한 세금 징수, 지폐 남발","왕위 계승 분쟁과 지배층의 사치·낭비로 재정도 나빠졌어요."],
["won","원 말 농민 반란으로 원이 쇠퇴하는 계기가 된 사건은?","홍건적의 난","1368년 원은 주원장에게 북쪽으로 쫓겨났어요."],
["ming","홍건적에서 두각을 나타내 1368년 명을 세운 농민 출신 인물은?","주원장(홍무제)","난징(금릉)을 수도로 삼았어요. 한족 왕조가 다시 중국을 지배했어요."],
["ming","홍무제가 황제의 독재권을 강화하려고 폐지한 직책(국무총리 격)은?","재상",""],
["ming","관리가 마을마다 찾아가지 않아도 농민이 스스로 세금을 걷고 마을 질서를 지키게 한, 홍무제의 농촌 자치·세금 징수 제도는?","이갑제","110호를 1리로 묶어 세금 징수와 치안을 맡겼어요."],
["ming","토지 대장(어린도책)과 호적·조세 장부(부역황책)를 만든 명의 황제는?","홍무제(명 태조)","이를 통해 농촌 지배력이 강해졌어요."],
["ming","홍무제가 유교 질서를 회복하려고 백성 교육용으로 반포한 여섯 가지 교훈은?","육유","몽골 풍습을 금지하고 학교 교육을 강화했어요."],
["ming","베이징으로 천도하고 자금성을 지은 명의 황제는?","영락제",""],
["ming","명 초(1405~1433) 동남아에서 아프리카 동부 해안까지 일곱 차례 항해한 환관은?","정화","바스쿠 다 가마보다 90년쯤 앞섰어요."],
["ming","정화의 항해 결과 명이 여러 나라와 맺은 외교 관계는?","조공·책봉 관계","주변국이 사절단을 보내 예물을 바치면 중국이 군주를 왕으로 임명하는 방식이에요."],
["ming","명 후기 북쪽의 몽골족과 남쪽의 왜구에게 시달린 재앙을 뜻하는 말은?","북로남왜",""],
["ming","명이 조선에 군사를 지원해 재정이 더 나빠진 전쟁은?","임진왜란","백성에게 과중한 세금을 걷게 되었어요."],
["ming","1644년 명을 멸망시킨 농민 반란의 지도자는?","이자성","이후 만주에서 성장한 청이 중국 전역을 장악했어요."],
["qing","1616년 후금을 세운 청 태조는?","누르하치","여진족(만주족)이에요."],
["qing","1636년 청과 조선 사이에 벌어진 전쟁은?","병자호란","청 태종 때 국호를 후금에서 청으로 바꿨어요."],
["qing","소수의 만주족이 다수의 한족을 지배하려고 함께 쓴 두 정책은?","회유책(당근)과 강압책(채찍)","바로 다음 두 카드에서 구체적인 사례를 확인해요."],
["qing","청의 강압책 사례는?","변발·호복 강요, 청 비판 서적 금지","한족의 중화사상도 탄압했어요."],
["qing","청의 회유책 사례는?","과거제 실시, 만주족과 한족 함께 등용, 『사고전서』 편찬","한족 학자들을 동원한 대규모 편찬 사업이에요."],
["qing","명·청 시대 지방에서 세금 징수와 치안 유지를 도운 지배 계층은?","신사","전·현직 관리인 신(紳)과 학생·졸업생 등 사(士)로 이루어졌어요."],
["qing","명·청 시대에 사적인 해상 무역을 제한한 정책은?","해금 정책","유럽 상인이 차·비단·도자기를 원해 점차 완화되었어요."],
["qing","해외 무역으로 중국에 대량 유입되어 화폐와 세금으로 쓰인 금속은?","은","명의 일조편법, 청의 지정은제로 세금도 은으로 냈어요."],
["qing","18세기 중반 이후 청이 서양과의 무역을 허용한 유일한 항구와 무역 상인 조합은?","광저우, 공행",""],
["qing","마테오 리치가 중국 지식인과 만든 세계 지도(1602)는?","곤여만국전도","중국 중심의 세계관에서 벗어나는 계기가 되었어요."],
["qing","송·명·청 시대 학문의 흐름은?","성리학 → 양명학 → 고증학","성리학은 주희가 완성, 양명학은 앎과 행동의 일치를 강조, 고증학은 경전을 실증적으로 연구했어요."],
["qing","명 시대에 인기를 끈 소설 세 편은?","삼국지연의, 서유기, 수호전","청 시대에는 『홍루몽』이 유행했고 베이징에서 경극이 생겼어요."],
["qing","한족이 자신들을 세계 문명의 중심이라고 부르던 말은?","중화","조선은 명이 망한 뒤 스스로를 소중화라고 여겼어요."],
["modern","영국이 차·비단·도자기 대금을 마련하려고 인도에서 청으로 밀수출한 물품은?","아편","아편 중독자가 늘고 은이 해외로 빠져나가 청의 재정이 나빠졌어요."],

/* 제어문자·방향 조작 문자(RLO 등)·제로폭 문자를 걸러 내고 길이를 제한한다 */
function clean(s,max){return String(s==null?"":s).replace(/[\u0000-\u001f\u007f​-‏‪-‮⁦-⁩﻿]/g," ").replace(/\s+/g," ").trim().slice(0,max)}
function djb(s){var h=5381;s=String(s);for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
/* AI 프롬프트에 넣을 데이터: 태그를 닫는 < > 를 비슷하게 생긴 문자로 바꿔 구조를 깨지 못하게 한다 */
function fence(s,max){return clean(s,max).replace(/</g,"‹").replace(/>/g,"›")}
function hasPII(s){
  s=String(s);
  if(/[\w.+-]+@[\w-]+\.[a-z]{2,}/i.test(s))return "이메일 주소";
  if(/(?:^|\D)0\d{1,2}[-.\s]?\d{3,4}[-.\s]?\d{4}(?:\D|$)/.test(s))return "전화번호";
  if(/\d{6}[-\s]?[1-4]\d{6}/.test(s))return "주민등록번호";
  if(/https?:\/\/|www\./i.test(s))return "인터넷 주소";
  return "";
}
function norm(s){return String(s).toLowerCase().replace(/[\s·・.,，、'"“”‘’『』「」?!~\-–—()（）]/g,"")}
function accepted(ans){
  var out=[norm(ans)],m=String(ans).match(/^([^()]+)\(([^()]+)\)$/);
  if(m){out.push(norm(m[1]),norm(m[2]))}
  out.slice().forEach(function(x){if(/^제\d/.test(x))out.push(x.slice(1))});
  return out;
}
function checkTyped(ans,input){var n=norm(input);return n.length>0&&accepted(ans).indexOf(n)>=0}
function typable(a){return a.length<=14&&!/[,→]/.test(a)&&!/업적/.test(a)}
function mcOk(a){return a.length<=28}

function sanitizeCustom(arr){
  if(!Array.isArray(arr))return [];
  var out=[],seen={};
  for(var i=0;i<arr.length&&out.length<LIM.custom;i++){
    var c=arr[i]; if(!c||typeof c!=="object")continue;
    if(typeof c.q!=="string"||typeof c.a!=="string"||(c.note!=null&&typeof c.note!=="string"))continue;
    var q=clean(c.q,LIM.q),a=clean(c.a,LIM.a),n=clean(c.note,LIM.n);
    if(!q||!a||ERA_IDS.indexOf(c.era)<0)continue;
    if(hasPII(q+" "+a+" "+n))continue;
    var id=(typeof c.id==="string"&&/^c[a-z0-9]{4,24}$/.test(c.id))?c.id:"c"+djb(c.era+"|"+q+"|"+a);
    if(seen[id])continue; seen[id]=1;
    out.push({id:id,era:c.era,q:q,a:a,note:n});
  }
  return out;
}
function sanitizeProg(o){
  var out={},n=0;
  if(!o||typeof o!=="object"||Array.isArray(o))return out;
  Object.keys(o).forEach(function(k){
    if(n>=LIM.prog||!/^[bcp][a-z0-9]{3,24}$/.test(k))return;
    var p=o[k]; if(!p||typeof p!=="object")return;
    var b=Math.floor(Number(p.b)),t=Math.floor(Number(p.t));
    if(!(b>=0&&b<=5)||!(t>=0&&t<=4e12))return;
    out[k]={b:b,t:t};n++;
  });
  return out;
}
function mergeProg(a,b){var out={};Object.keys(a).forEach(function(k){out[k]=a[k]});Object.keys(b).forEach(function(k){if(!out[k]||b[k].t>out[k].t)out[k]=b[k]});return out}
function pruneProg(p,exists){var out={};Object.keys(p).forEach(function(k){if(exists(k))out[k]=p[k]});return out}

/* 라이트너 상자: 맞히면 한 단계 위, 틀리면 0단계. 새 카드를 바로 맞히면 2단계부터 시작 */
function reviewed(p,ok,now){var b=p?p.b:-1;return {b:ok?(b<0?2:Math.min(5,b+1)):0,t:now}}
function isDue(p,now){return !p||now>=p.t+BOX_DAYS[p.b]*DAY}
function isWeak(p){return !!p&&p.b===0}
function isMastered(p){return !!p&&p.b>=3}

function bigrams(s){var t=norm(s),o={};for(var i=0;i<t.length-1;i++)o[t.slice(i,i+2)]=1;return Object.keys(o)}
function relevant(cards,query,k){
  var bg=bigrams(query);if(!bg.length)return [];
  var sc=cards.map(function(c){var t=norm(c.q+c.a+c.note),s=0;bg.forEach(function(b){if(t.indexOf(b)>=0)s++});return {c:c,s:s}}).filter(function(x){return x.s>0});
  if(!sc.length)return [];
  sc.sort(function(a,b){return b.s-a.s});
  var cut=Math.max(1,Math.ceil(sc[0].s/2));
  return sc.filter(function(x){return x.s>=cut}).slice(0,k).map(function(x){return x.c});
}
function pickDistractors(card,cards,rnd,n){
  var na=norm(card.a);
  var pool=cards.filter(function(x){return x.id!==card.id&&mcOk(x.a)&&norm(x.a)!==na});
  var same=pool.filter(function(x){return x.era===card.era});
  if(same.length>=n*2)pool=same;
  var sc=pool.map(function(x){return {x:x,s:Math.abs(x.a.length-card.a.length)+rnd()*5}}).sort(function(a,b){return a.s-b.s});
  var out=[],seen={};
  for(var i=0;i<sc.length&&out.length<n;i++){
    var k=norm(sc[i].x.a);
    if(seen[k]||k.indexOf(na)>=0||na.indexOf(k)>=0)continue;
    seen[k]=1;out.push(sc[i].x.a);
  }
  return out;
}

function parseImport(text){
  if(typeof text!=="string"||!text.trim()||text.length>LIM.imp)throw new Error("size");

}
function migrateV1(cr,hr,ids,now){

  });

}

function sanitizeApproved(o){
  var out=[],seen={};
  if(!o||typeof o!=="object"||!Array.isArray(o.cards))return out;
  for(var i=0;i<o.cards.length&&out.length<300;i++){
    var c=o.cards[i];if(!c||typeof c!=="object")continue;
    if(typeof c.q!=="string"||typeof c.a!=="string"||(c.note!=null&&typeof c.note!=="string"))continue;
    var q=clean(c.q,LIM.q),a=clean(c.a,LIM.a),n=clean(c.note,LIM.n);
    if(!q||!a||ERA_IDS.indexOf(c.era)<0||hasPII(q+" "+a+" "+n))continue;
    var id="p"+djb(cardKey(c.era,q,a));
    if(seen[id])continue;seen[id]=1;
    out.push({id:id,era:c.era,q:q,a:a,note:n});

function sanitizePending(arr){
  if(!Array.isArray(arr))return [];
  var out=[],seen={};
  for(var i=0;i<arr.length&&out.length<PEND_MAX;i++){
    var c=arr[i];if(!c||typeof c!=="object")continue;
    if(typeof c.q!=="string"||typeof c.a!=="string"||(c.note!=null&&typeof c.note!=="string"))continue;
    var q=clean(c.q,LIM.q),a=clean(c.a,LIM.a),n=clean(c.note,LIM.n);
    if(!q||!a||ERA_IDS.indexOf(c.era)<0||hasPII(q+" "+a+" "+n))continue;
    var id=(typeof c.id==="string"&&/^s[a-z0-9]{4,24}$/.test(c.id))?c.id:"s"+djb(cardKey(c.era,q,a));
    if(seen[id])continue;seen[id]=1;
    var t=Math.floor(Number(c.t));
    out.push({id:id,era:c.era,q:q,a:a,note:n,t:(t>0&&t<4e12)?t:0});
  }

}

    else if(v===true)e.setAttribute(k,"");
    else if(v!==false&&v!=null)e.setAttribute(k,String(v));});
  for(var i=2;i<arguments.length;i++){[].concat(arguments[i]).forEach(function(k){if(k==null||k===false)return;e.append(k.nodeType?k:document.createTextNode(String(k)))})}

}

    var cq=clean(q.value,LIM.q),ca=clean(a.value,LIM.a),cn=clean(n.value,LIM.n);
    if(!cq||!ca){msg.textContent="문제와 정답을 모두 적어 주세요.";return}
    var pii=hasPII(cq+" "+ca+" "+cn);if(pii){msg.textContent="카드에 "+pii+"가 들어 있어요. 개인정보는 지우고 다시 눌러 주세요.";return}
    var key=cardKey(era.value,cq,ca);
    if(CARDS.some(function(c){return cardKey(c.era,c.q,c.a)===key})||pending.some(function(c){return cardKey(c.era,c.q,c.a)===key})){msg.textContent="이미 있는 카드예요.";return}
    if(pending.length>=PEND_MAX){msg.textContent="검토 대기 카드는 "+PEND_MAX+"장까지 담을 수 있어요. 보낸 카드는 지워 주세요.";return}
    var p={id:"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),era:era.value,q:cq,a:ca,note:cn,t:Date.now()};
    pending.unshift(p);savePending();S.lastSub=p.id;
    flash("카드를 '검토 대기'에 담았어요. 아래에서 메일을 보내야 선생님께 전달돼요.");S.focus="sub-"+p.id;renderAll();
  }},
    h("div",{},h("label",{for:"f-era"},"시대"),era),
    h("div",{},h("label",{for:"f-q"},"문제"),q),
    h("div",{},h("label",{for:"f-a"},"정답"),a),
    h("div",{},h("label",{for:"f-n"},"설명"),n),
    h("div",{class:"row"},h("button",{class:"btn primary",type:"submit"},"카드 제출"),msg));
  box.append(h("h2",{},"내 카드 제안하기"));
  box.append(h("div",{class:"box soft"},"카드를 만들어 제출하면 선생님이 검토해요. 승인된 카드는 모두의 카드에 들어가요. 승인되기 전에는 이 기기의 '검토 대기' 목록에만 있어요."));
  box.append(h("div",{class:"box"},form));

  if(pending.length){
    box.append(h("h2",{},"검토 대기 카드 ("+pending.length+")"));
    box.append(h("div",{class:"box soft"},h("div",{},"메일 앱이 열리면 '보내기'까지 눌러야 선생님께 전달돼요. 열리지 않으면 '내용 복사'를 눌러 메일에 붙여 넣고 아래 주소로 보내세요."),
      h("div",{class:"mono",style:"margin-top:6px;user-select:all"},OWNER_EMAIL)));
    pending.forEach(function(p){
      var ta=h("textarea",{readonly:true,rows:"6",hidden:true,"aria-label":"제출 내용",spellcheck:"false"});
      var cm=h("span",{class:"note",role:"status"});
      var en=ERA_NAME[p.era];
      box.append(h("div",{class:"box",id:"sub-"+p.id,tabindex:"-1"},
        h("div",{class:"side"},en+" · 검토 대기"+(S.lastSub===p.id?" · 방금 담았어요":"")),
        h("div",{class:"q",style:"font-size:16px"},p.q),h("div",{class:"ans",style:"font-size:20px"},p.a),p.note?h("div",{class:"note"},p.note):null,
        h("div",{class:"row",style:"margin-top:10px"},
          extLink("btn primary",mailHref(p,en),"메일 보내기: "+p.q,["메일 보내기"]),
          h("button",{class:"btn",type:"button",onclick:function(){copyText(submissionText(p,en),ta,cm)}},"내용 복사"),
          h("button",{class:"btn warn",type:"button","aria-label":"제출 목록에서 삭제: "+p.q,onclick:function(){
            pending=pending.filter(function(x){return x.id!==p.id});savePending();renderAll()}},"삭제"),cm),
        h("div",{style:"height:8px"}),ta));
    });
  }
  if(approved.length)box.append(h("div",{class:"note"},"승인된 카드 "+approved.length+"장이 카드 탭에 들어 있어요."));
  if(custom.length){
    box.append(h("div",{class:"box"},h("div",{class:"note"},"이 기기에만 있는 내 카드 "+custom.length+"장 (예전에 만든 카드)"),
      custom.map(function(c){return h("div",{class:"mine"},h("span",{},c.q+" → "+c.a),
        h("button",{class:"btn warn",type:"button","aria-label":"카드 삭제: "+c.q,onclick:function(){
          custom=custom.filter(function(x){return x.id!==c.id});persistCustom();renderAll()}},"삭제"))})));
  }

  var bk=h("textarea",{id:"bk",placeholder:"백업 글을 여기에 붙여 넣고 '가져오기'를 눌러요.",spellcheck:"false"});
  var bmsg=h("div",{class:"note",role:"status"});
  box.append(h("h2",{},"백업과 복원"));
  box.append(h("div",{class:"box"},
    h("div",{class:"note"},"내 카드와 학습 기록은 이 기기의 이 브라우저에만 저장돼요. 브라우저 데이터를 지우면 사라지니, 다른 기기로 옮기거나 보관하려면 내보낸 글을 복사해 두세요."),
    h("div",{style:"height:10px"}),bk,
    h("div",{class:"row",style:"margin-top:10px"},
      h("button",{class:"btn",type:"button",onclick:function(){
        bk.value=exportData(custom,prog);bk.select();
        try{navigator.clipboard.writeText(bk.value).then(function(){bmsg.textContent="복사했어요."},function(){bmsg.textContent="글을 선택했어요. 직접 복사해 주세요."})}catch(e){bmsg.textContent="글을 선택했어요. 직접 복사해 주세요."}
      }},"내보내기"),
      h("button",{class:"btn primary",type:"button",onclick:function(){
        try{
          var m=parseImport(bk.value),have={},added=0;
          custom.forEach(function(c){have[c.era+"|"+c.q]=1});
          m.custom.forEach(function(c){
            if(custom.length>=LIM.custom||have[c.era+"|"+c.q])return;
            if(custom.some(function(x){return x.id===c.id}))c.id=newId();
            custom.push(c);have[c.era+"|"+c.q]=1;added++;
          });
          prog=mergeProg(prog,m.prog);persistCustom();
          flash("가져왔어요. 새 카드 "+added+"장을 더했어요.");renderAll();
        }catch(e){bmsg.textContent="가져올 수 없는 글이에요. '내보내기'로 만든 글을 그대로 붙여 넣어 주세요."}
      }},"가져오기"),
      bmsg)));

  var armed=false,timer=0;
  var reset=h("button",{class:"btn warn",type:"button",id:"reset",onclick:function(){
    if(!armed){armed=true;reset.textContent="정말 지울까요? 한 번 더 누르세요";timer=setTimeout(function(){armed=false;reset.textContent="모든 기록 지우기"},5000);return}
    clearTimeout(timer);
    ["cn-v2-custom","cn-v2-prog","cn-v2-pending","cn-custom-v1","cn-hard-v1"].forEach(lsDel);
    custom=[];prog={};pending=[];buildCards();resetOrder(false);S.quiz=null;S.ai={q:"",out:""};S.lastSub=null;
    flash("내 카드, 제출 목록, 학습 기록을 모두 지웠어요.");renderAll();
  }},"모든 기록 지우기");
  box.append(h("h2",{},"공용 컴퓨터라면"));
  box.append(h("div",{class:"box"},h("div",{class:"note"},"학교나 도서관 컴퓨터에서는 다 쓴 뒤에 기록을 지워 주세요. 지운 기록은 되돌릴 수 없어요."),h("div",{class:"row",style:"margin-top:10px"},reset)));
  return box;
}

/* ================= 시작 ================= */
/* approved.json: 선생님이 승인한 카드. 없거나 형식이 틀리면 조용히 무시한다 */
function loadApproved(){
  try{
    fetch("approved.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("http");return r.text()}).then(function(t){
      if(t.length>200000)throw new Error("size");
      var list=sanitizeApproved(JSON.parse(t));
      if(!list.length)return;
      approved=list;
      var keys={};approved.forEach(function(c){keys[cardKey(c.era,c.q,c.a)]=1});
      var before=pending.length;
      pending=pending.filter(function(p){return !keys[cardKey(p.era,p.q,p.a)]});
      if(pending.length!==before){savePending();flash("제출한 카드 "+(before-pending.length)+"장이 승인되어 카드에 들어갔어요.")}
      buildCards();resetOrder(false);renderAll();
    }).catch(function(){});
  }catch(e){}
}
renderAll();
loadApproved();
})();
</script>
</body>
</html>
